<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farol · David Ciro</title>
<!--
  Dirección 2 · FAROL
  Concepto: un diario de viaje a la luz de un farol, en la oscuridad de Hollow Knight.
  Tinta, polvo que cae despacio, ornamentos de trazo fino que se dibujan solos.
  Form desde el contenido: el "Diario del cazador" de Hollow Knight es una lista de
  entradas con nota; tu música, tus juegos y tus repos son exactamente eso.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d11;
    --surface: #12151b;
    --ink-line: rgba(235, 229, 213, 0.12);
    --text: #ebe5d5;
    --muted: #98a0aa;
    --lamp: #e6b85c;
    --mist: #6f8296;
    --ease: cubic-bezier(0.25, 1, 0.5, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--bg); }
  body { font-family: 'Alegreya Sans', system-ui, sans-serif; color: var(--text); background: var(--bg);
    min-height: 100dvh; -webkit-font-smoothing: antialiased; font-size: 16px; }
  a { color: inherit; text-decoration: none; }

  #dust { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  /* Niebla del fondo del pozo y halo del farol detrás del retrato */
  body::before { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(60% 40% at 50% 100%, rgba(111, 130, 150, 0.18), transparent 70%),
      radial-gradient(40% 25% at 50% 8%, rgba(230, 184, 92, 0.10), transparent 70%); }

  .wrap { position: relative; z-index: 1; max-width: 440px; margin: 0 auto; padding: 64px 22px 72px; text-align: center; }

  .portrait { width: 112px; height: 112px; margin: 0 auto; position: relative; }
  .portrait img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block;
    filter: saturate(0.75) contrast(1.05); }
  .portrait svg { position: absolute; inset: -14px; width: calc(100% + 28px); height: calc(100% + 28px); overflow: visible; }
  .portrait circle { fill: none; stroke: var(--text); stroke-width: 1; opacity: .55; }

  h1 { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 44px; letter-spacing: 0.01em; line-height: 1; margin-top: 28px; }
  .title { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px; color: var(--muted); margin-top: 8px; }
  .line { color: #cfc8b8; line-height: 1.6; margin: 18px auto 0; max-width: 32ch; }

  /* Ornamento: se dibuja al cargar */
  .orn { display: block; margin: 30px auto; width: 220px; height: 22px; color: var(--text); opacity: .6; }
  .orn path { fill: none; stroke: currentColor; stroke-width: 1; stroke-linecap: round;
    stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 2.2s var(--ease) forwards; }
  .orn .gem { fill: var(--lamp); stroke: none; opacity: 0; animation: glow-in 1s 1.4s forwards; }

  .socials { display: flex; justify-content: center; gap: 22px; margin-top: 22px; }
  .socials a { color: var(--muted); padding: 8px; transition: color .3s, transform .4s var(--ease); }
  .socials a:hover, .socials a:focus-visible { color: var(--lamp); transform: translateY(-2px); }

  /* Enlaces: texto, sin cajas */
  .links { display: grid; gap: 4px; }
  .links a { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 500; padding: 8px 0;
    display: inline-flex; align-items: center; justify-content: center; gap: 14px; transition: color .3s; }
  .links a .mk { width: 7px; height: 7px; transform: rotate(45deg); border: 1px solid var(--muted); opacity: 0; transition: opacity .3s, background .3s, border-color .3s; }
  .links a:hover, .links a:focus-visible { color: var(--lamp); }
  .links a:hover .mk, .links a:focus-visible .mk { opacity: 1; background: var(--lamp); border-color: var(--lamp); }
  .links a.main { font-style: italic; color: var(--lamp); }

  /* Entradas del diario */
  .entry { text-align: left; margin-top: 52px; }
  .entry-h { display: flex; align-items: center; gap: 14px; }
  .entry-h h2 { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 28px; }
  .entry-h::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--ink-line), transparent); }
  .entry-sub { color: var(--muted); font-size: 15px; margin-top: 4px; }

  .feature { display: grid; grid-template-columns: 92px 1fr; gap: 18px; align-items: center; margin-top: 20px; }
  .feature img { width: 92px; height: 92px; object-fit: cover; border-radius: 4px; display: block;
    box-shadow: 0 0 0 1px var(--ink-line), 0 18px 40px rgba(0,0,0,0.5); }
  .state { font-size: 13px; color: var(--lamp); display: inline-flex; gap: 8px; align-items: center; font-weight: 500; letter-spacing: .02em; }
  .state i { width: 6px; height: 6px; border-radius: 50%; background: var(--lamp); box-shadow: 0 0 10px var(--lamp); animation: flicker 3s infinite; }
  .feature h3 { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 600; line-height: 1.1; margin-top: 6px; }
  .feature p { color: var(--muted); }
  .thread { height: 1px; background: var(--ink-line); margin-top: 14px; position: relative; }
  .thread span { position: absolute; left: 0; top: 0; height: 1px; background: var(--lamp); }
  .thread span::after { content: ''; position: absolute; right: -3px; top: -3px; width: 7px; height: 7px; background: var(--lamp); transform: rotate(45deg); box-shadow: 0 0 10px var(--lamp); }
  .times { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-top: 8px; font-variant-numeric: tabular-nums; }

  .switch { display: flex; gap: 20px; margin-top: 26px; }
  .switch button { appearance: none; background: none; border: 0; color: var(--muted); font: inherit; font-size: 15px; cursor: pointer; padding: 4px 0;
    border-bottom: 1px solid transparent; transition: color .3s, border-color .3s; }
  .switch button[aria-selected="true"] { color: var(--text); border-color: var(--lamp); }

  .notes { margin-top: 8px; }
  .note { display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--ink-line); }
  .note:last-child { border-bottom: 0; }
  .note img { width: 44px; height: 44px; border-radius: 3px; object-fit: cover; display: block; filter: saturate(.85); }
  .note .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note .s { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note .m { color: var(--muted); font-size: 13px; font-style: italic; font-family: 'Cormorant Garamond', serif; font-size: 16px; }
  .min { min-width: 0; }

  .ask { margin-top: 26px; padding: 20px; border: 1px solid var(--ink-line); border-radius: 4px; background: rgba(18, 21, 27, 0.7); }
  .ask label { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; display: block; }
  .ask p { color: var(--muted); margin-top: 4px; font-size: 15px; }
  .ask input { width: 100%; margin-top: 14px; background: transparent; border: 0; border-bottom: 1px solid var(--muted);
    color: var(--text); font: inherit; padding: 10px 2px; }
  .ask input::placeholder { color: var(--muted); }
  .ask input:focus { outline: none; border-color: var(--lamp); }

  .relics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 22px; }
  .relics figure { margin: 0; text-align: center; }
  .relics img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 50%; display: block;
    box-shadow: 0 0 0 1px var(--ink-line), 0 0 0 5px var(--bg), 0 0 0 6px var(--ink-line); filter: saturate(.8);
    transition: filter .4s, transform .5s var(--ease); }
  .relics figure:hover img { filter: saturate(1.1); transform: translateY(-3px); }
  .relics figcaption { font-size: 13px; margin-top: 10px; line-height: 1.3; }
  .relics figcaption small { display: block; color: var(--muted); font-style: italic; font-family: 'Cormorant Garamond', serif; font-size: 15px; }

  .count { display: flex; align-items: baseline; gap: 10px; margin-top: 18px; }
  .count b { font-family: 'Cormorant Garamond', serif; font-size: 48px; font-weight: 500; line-height: 1; color: var(--lamp); }
  .count span { color: var(--muted); }
  .heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; margin-top: 16px; }
  .heat i { aspect-ratio: 1; border-radius: 50%; background: rgba(235,229,213,0.06); }
  .heat i[data-l="1"] { background: rgba(230,184,92,0.25); }
  .heat i[data-l="2"] { background: rgba(230,184,92,0.45); }
  .heat i[data-l="3"] { background: rgba(230,184,92,0.7); }
  .heat i[data-l="4"] { background: var(--lamp); box-shadow: 0 0 6px rgba(230,184,92,.6); }
  .repo { display: block; padding: 14px 0; border-bottom: 1px solid var(--ink-line); }
  .repo .n { display: flex; justify-content: space-between; gap: 12px; font-weight: 500; }
  .repo .tag { color: var(--muted); font-size: 14px; font-style: italic; font-family: 'Cormorant Garamond', serif; font-size: 16px; }
  .repo .d { color: var(--muted); font-size: 15px; margin-top: 4px; line-height: 1.5; }

  footer { margin-top: 56px; color: var(--muted); font-size: 14px; display: flex; justify-content: space-between; }

  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes glow-in { to { opacity: 1; } }
  @keyframes flicker { 0%, 100% { opacity: 1; } 45% { opacity: .55; } 50% { opacity: .9; } 55% { opacity: .6; } }
  @keyframes appear { from { opacity: 0; transform: translateY(10px); filter: blur(3px); } }
  .appear { animation: appear 1.1s var(--ease) both; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
    .orn path { stroke-dashoffset: 0; } .orn .gem { opacity: 1; }
  }
</style>
</head>
<body>
<canvas id="dust" aria-hidden="true"></canvas>
<main class="wrap">
  <div class="portrait appear">
    <img src="assets/avatar-sm.jpg" alt="David Ciro">
    <svg viewBox="0 0 140 140" aria-hidden="true"><circle cx="70" cy="70" r="69"/></svg>
  </div>
  <h1 class="appear" style="animation-delay:.15s" id="name"></h1>
  <p class="title appear" style="animation-delay:.25s" id="title"></p>
  <p class="line appear" style="animation-delay:.35s" id="line"></p>
  <nav class="socials appear" style="animation-delay:.45s" id="socials" aria-label="Redes"></nav>

  <svg class="orn" viewBox="0 0 220 22" aria-hidden="true">
    <path d="M2 11 H86 C94 11 96 4 103 4 M218 11 H134 C126 11 124 4 117 4"/>
    <path d="M86 11 C94 11 98 18 104 18 M134 11 C126 11 122 18 116 18"/>
    <rect class="gem" x="106" y="7" width="8" height="8" transform="rotate(45 110 11)"/>
  </svg>

  <nav class="links appear" style="animation-delay:.55s" id="links" aria-label="Enlaces"></nav>

  <section class="entry" aria-labelledby="h-musica">
    <div class="entry-h"><h2 id="h-musica">Lo que suena</h2></div>
    <p class="entry-sub">Mi Spotify, en vivo.</p>
    <div id="music"></div>
  </section>

  <section class="entry" aria-labelledby="h-juegos">
    <div class="entry-h"><h2 id="h-juegos">Lo que juego</h2></div>
    <p class="entry-sub">Mi PlayStation, casi en vivo.</p>
    <div id="games"></div>
  </section>

  <section class="entry" aria-labelledby="h-codigo">
    <div class="entry-h"><h2 id="h-codigo">Lo que construyo</h2></div>
    <p class="entry-sub">Mi GitHub, incluido lo privado (sin detalles).</p>
    <div id="code"></div>
  </section>

  <footer><a href="#">Política de privacidad</a><span>Datos en vivo: ejemplo</span></footer>
</main>

<script src="assets/data.js"></script>
<script>
  const D = window.CIRO, U = window.CIRO_UTIL, $ = (id) => document.getElementById(id);
  $('name').textContent = D.profile.name;
  $('title').textContent = D.profile.title;
  $('line').textContent = D.profile.line;
  $('socials').innerHTML = D.socials.map(s => `<a href="${s.url}" aria-label="${s.name}">${U.icon(s.name, 18)}</a>`).join('');
  $('links').innerHTML = D.links.map((l, i) => `<a href="${l.url}" class="${i === 0 ? 'main' : ''}"><span class="mk"></span>${l.title}<span class="mk"></span></a>`).join('');

  const np = D.nowPlaying, pct = (np.progressMs / np.durationMs) * 100;
  const notes = (items, meta) => items.map(t => `<div class="note"><img src="${t.cover}" alt="">
    <div class="min"><div class="t">${t.title}</div><div class="s">${t.artist ?? t.sub}</div></div><span class="m">${meta(t)}</span></div>`).join('');
  $('music').innerHTML = `
    <div class="feature"><img src="${np.cover}" alt="${np.album}">
      <div class="min"><span class="state"><i></i>Sonando ahora</span><h3>${np.title}</h3><p>${np.artist}</p></div></div>
    <div class="thread"><span style="width:${pct}%"></span></div>
    <div class="times"><span>${U.fmt(np.progressMs)}</span><span>${U.fmt(np.durationMs)}</span></div>
    <div class="switch" role="tablist">
      <button role="tab" aria-selected="true" data-l="recent">Últimas</button>
      <button role="tab" aria-selected="false" data-l="top">Más escuchados del mes</button>
    </div>
    <div class="notes" id="notes">${notes(D.recent, t => U.ago(t.at))}</div>
    <div class="ask"><label for="ask">Déjame una canción</label>
      <p>Búscala y la guardo en mi playlist. A ver qué me descubres.</p>
      <input id="ask" type="search" placeholder="Canción o artista"></div>`;
  document.querySelectorAll('[data-l]').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('[data-l]').forEach(x => x.setAttribute('aria-selected', x === b));
    $('notes').innerHTML = b.dataset.l === 'top' ? notes(D.topMonth.items, () => '') : notes(D.recent, t => U.ago(t.at));
  }));

  const g = D.nowGaming;
  $('games').innerHTML = `
    <div class="feature"><img src="${g.cover}" alt="">
      <div class="min"><span class="state"><i></i>Jugando ahora</span><h3>${g.title}</h3><p>${g.platform}, desde hace ${g.since}</p></div></div>
    <div class="relics">${D.games.map(x => `<figure><img src="${x.cover}" alt=""><figcaption>${x.title}<small>${U.ago(x.at)}</small></figcaption></figure>`).join('')}</div>`;

  $('code').innerHTML = `
    <div class="count"><b>${D.github.last30}</b><span>contribuciones este mes, racha de ${D.github.streak} días</span></div>
    <div class="heat">${U.heatmap(26).flat().map(l => `<i data-l="${l}"></i>`).join('')}</div>
    <div style="margin-top:14px">${D.repos.map(r => r.private
      ? `<div class="repo"><div class="n"><span>${r.name}</span><span class="tag">privado</span></div></div>`
      : `<a class="repo" href="#"><div class="n"><span>${r.name}</span><span class="tag">${r.lang}</span></div>${r.desc ? `<div class="d">${r.desc}</div>` : ''}</a>`).join('')}</div>`;

  // Polvo que cae despacio, como en los pozos de Hallownest.
  const cv = $('dust'), ctx = cv.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, motes = [];
  function setup() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr;
    motes = Array.from({ length: 46 }, () => ({ x: Math.random() * W, y: Math.random() * H,
      r: (0.6 + Math.random() * 1.6) * dpr, v: (0.08 + Math.random() * 0.25) * dpr,
      sway: Math.random() * Math.PI * 2, a: 0.15 + Math.random() * 0.45, warm: Math.random() < 0.25 }));
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (const m of motes) {
      m.y += m.v; m.sway += 0.01; m.x += Math.sin(m.sway) * 0.15;
      if (m.y > H + 4) { m.y = -4; m.x = Math.random() * W; }
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      ctx.fillStyle = m.warm ? `rgba(230,184,92,${m.a})` : `rgba(235,229,213,${m.a * 0.7})`;
      ctx.fill();
    }
    if (!still) requestAnimationFrame(draw);
  }
  setup(); draw();
  addEventListener('resize', () => { setup(); if (still) draw(); });
</script>
</body>
</html>
